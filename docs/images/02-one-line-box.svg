  <text x="28" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#172347">② 点「添加到对话」→ 只弹出一行小输入框（无标题、无 ✕）</text>

