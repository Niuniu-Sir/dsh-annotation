<svg xmlns="http://www.w3.org/2000/svg" width="760" height="246" viewBox="0 0 760 246" role="img" aria-label="点编号角标打开编辑卡">
  <rect width="760" height="246" rx="10" fill="#f7f9fc"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#172347">⑤ 点编号角标 / 芯片 → 编辑卡（位置固定在原文正上方，不会移动）</text>

  <!-- edit card -->
  <rect x="96" y="48" width="360" height="132" rx="10" fill="#ffffff" stroke="#d9dee8"/>
  <text x="108" y="70" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#172347">编辑批注</text>
  <path d="M432 62 L444 74 M444 62 L432 74" stroke="#7b8698" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="108" y="78" width="336" height="22" rx="5" fill="#f4f6fa" stroke="#e2e7f0"/>
  <text x="118" y="93" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#5b6780">在选中文字上方；</text>
  <rect x="108" y="106" width="336" height="34" rx="6" fill="#f9fbff" stroke="#cfd8e6"/>
  <text x="118" y="123" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9aa4b5">写下批注…</text>
  <text x="118" y="135" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#c3cbd8">（可留空，保存后仅标记原文）</text>

  <!-- footer buttons -->
  <text x="112" y="166" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#e5484d">🗑 删除</text>
  <rect x="322" y="150" width="52" height="22" rx="8" fill="#ffffff" stroke="#cfd8e6"/>
  <text x="348" y="165" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#172347">取消</text>
  <rect x="382" y="150" width="62" height="22" rx="8" fill="#3b4a63"/>
  <text x="413" y="165" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#ffffff">保存</text>

  <!-- paragraph with marker -->
  <rect x="32" y="196" width="196" height="11" rx="5.5" fill="#fbeecb"/>
  <rect x="236" y="196" width="228" height="11" rx="5.5" fill="#fbeecb"/>
  <circle cx="34" cy="188" r="9" fill="#4c9aff" stroke="#ffffff" stroke-width="1"/>
  <text x="34" y="192" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>

  <text x="32" y="236" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#5b6780">删除：编辑卡里的「🗑 删除」，或对话里批注入口的芯片列表（两处都能删）</text>
</svg>
