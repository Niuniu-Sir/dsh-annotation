  <rect x="32" y="156" width="250" height="11" rx="5.5" fill="#d7dce6"/>

  <text x="32" y="188" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#5b6780">框很窄、只有一行；位置永远紧贴选中文字的正上方</text>
