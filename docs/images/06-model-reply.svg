<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" role="img" aria-label="发送后模型按编号逐条回答">
  <rect width="760" height="232" rx="10" fill="#f7f9fc"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#172347">⑥ 回车发送：批注块随消息一起提交，模型按编号逐条回答</text>

  <!-- user bubble -->
  <rect x="330" y="54" width="398" height="46" rx="12" fill="#e8f0ff" stroke="#c9dbff"/>
  <rect x="346" y="64" width="86" height="20" rx="10" fill="#ffffff" stroke="#c9dbff"/>
  <text x="389" y="78" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#2f5fd0">批注 ×2</text>
  <rect x="444" y="68" width="268" height="9" rx="4.5" fill="#b9cdf5"/>
  <rect x="346" y="86" width="180" height="8" rx="4" fill="#cddcf7"/>

  <!-- assistant reply -->
  <rect x="32" y="116" width="64" height="20" rx="10" fill="#eef3ff" stroke="#c9dbff"/>
  <text x="64" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#2f5fd0">批注 1</text>
  <rect x="104" y="121" width="540" height="9" rx="4.5" fill="#d7dce6"/>
  <rect x="32" y="150" width="64" height="20" rx="10" fill="#eef3ff" stroke="#c9dbff"/>
  <text x="64" y="164" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#2f5fd0">批注 2</text>
  <rect x="104" y="155" width="470" height="9" rx="4.5" fill="#d7dce6"/>
  <rect x="104" y="176" width="360" height="9" rx="4.5" fill="#d7dce6"/>

  <text x="32" y="214" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#5b6780">回复里的编号标签是可悬停芯片：显示被批注的原文 + 你的备注</text>
</svg>
