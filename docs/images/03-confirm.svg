<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" role="img" aria-label="三种确认方式">
  <rect width="760" height="216" rx="10" fill="#f7f9fc"/>
  <text x="28" y="34" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#172347">③ 三种「确认」方式等价于回车；留空也算标记原文</text>

  <rect x="150" y="52" width="336" height="46" rx="10" fill="#ffffff" stroke="#d9dee8"/>
  <rect x="160" y="62" width="266" height="26" rx="6" fill="#f9fbff" stroke="#cfd8e6"/>
  <text x="170" y="79" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#9aa4b5">添加批注…</text>
  <circle cx="458" cy="75" r="14" fill="#111111"/>
  <path d="M451.5 75.5 L456.5 80.5 L465 71" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- callouts -->
  <rect x="42" y="60" width="86" height="26" rx="13" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="85" y="77" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#2f5fd0">回车 ↵</text>
  <rect x="504" y="60" width="96" height="26" rx="13" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="552" y="77" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#2f5fd0">点圆形 ✓</text>
  <rect x="504" y="96" width="120" height="26" rx="13" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="564" y="113" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#2f5fd0">点框外任意处</text>

  <!-- result line with marker -->
  <rect x="32" y="140" width="196" height="11" rx="5.5" fill="#fbeecb"/>
  <rect x="236" y="140" width="228" height="11" rx="5.5" fill="#fbeecb"/>
  <circle cx="34" cy="132" r="9" fill="#4c9aff" stroke="#ffffff" stroke-width="1"/>
  <text x="34" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>
  <rect x="32" y="160" width="260" height="11" rx="5.5" fill="#d7dce6"/>

  <text x="32" y="203" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#5b6780">Esc = 取消（唯一的取消方式）；确认后文字被高亮并带上编号角标</text>
</svg>
